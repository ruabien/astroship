backend:
  name: github
  repo: ruabien/astroship
  branch: main
  base_url: https://decap-auth-ruabien.ruabien1504.workers.dev
  auth_endpoint: auth

display_url: https://hotro.online
media_folder: "public/images"
public_folder: "/images"

# --- BỘ LỌC TỰ ĐỘNG BỎ DẤU TIẾNG VIỆT TOÀN HỆ THỐNG ---
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  # --- TẬP HỢP 1: QUẢN LÝ EBOOKS (Giữ nguyên cấu trúc chạy tốt của bạn) ---
  - name: "ebooks"
    label: "Ebooks"
    folder: "src/content/ebooks"
    create: true
    slug: "{{title}}"
    preview_path: "shop/{{slug}}"
    fields:
      - {label: "Tiêu đề", name: "title", widget: "string"}
      - {label: "Giá (VNĐ)", name: "price", widget: "number"}
      - {label: "Mô tả ngắn", name: "description", widget: "text"}
      - {label: "Ảnh bìa", name: "image", widget: "image"}
      - {label: "Nội dung chi tiết", name: "body", widget: "markdown"}

  # --- TẬP HỢP 2: QUẢN LÝ BLOG (Chuẩn hóa Dropdown danh mục khớp Menu trang chủ) ---
  - name: "blog"
    label: "Bài viết Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Tiêu đề bài viết", name: "title", widget: "string"}
      - {label: "Mô tả ngắn", name: "snippet", widget: "text"}
      
      # Tự động bọc dấu ngoặc kép khi xuất bản ngày đăng để né triệt để lỗi Schema date/string
      - {label: "Ngày đăng", name: "publishDate", widget: "datetime", format: '"YYYY-MM-DD"', date_format: "YYYY-MM-DD", time_format: false}
      
      - {label: "Tác giả", name: "author", widget: "string", default: "Admin"}
      
      # Cấu hình hình ảnh dạng Object (gồm src và alt) bảo mật hệ thống biên dịch
      - label: "Hình ảnh đại diện"
        name: "image"
        widget: "object"
        fields:
          - {label: "Chọn ảnh", name: "src", widget: "image"}
          - {label: "Chữ thay thế ảnh (Alt)", name: "alt", widget: "string", default: "Hình ảnh bài viết"}

      # NÂNG CẤP QUYẾT ĐỊNH: Biến ô nhập chữ thành Dropdown chọn 4 chuyên mục chuyên gia Pháp lý AI
      - label: "Danh mục (Category)"
        name: "category"
        widget: "select"
        default: "ai-kiem-sat"
        options:
          - { label: "AI & Thực Tiễn Kiểm Sát", value: "ai-kiem-sat" }
          - { label: "Kỹ Nghệ Prompt Pháp Lý", value: "prompt-phap-ly" }
          - { label: "Pháp Luật Kỷ Nguyên Số", value: "phap-luat-so" }
          - { label: "Nhật Ký Kiểm Sát", value: "nhat-ky-nghe" }

      - {label: "Từ khóa (Tags)", name: "tags", widget: "list", default: ["blog"]}
      - {label: "Lưu nháp? (Draft)", name: "draft", widget: "boolean", default: false}
      
      - {label: "Nội dung bài viết", name: "body", widget: "markdown"}
